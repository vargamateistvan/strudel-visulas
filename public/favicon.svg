<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Strudel Studio Favicon</title>
  <desc id="desc">Minimal neon ring with pulse bars.</desc>

  <defs>
    <linearGradient id="ringGradient" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff88"/>
      <stop offset="1" stop-color="#00ffff"/>
    </linearGradient>
    <linearGradient id="pulseGradient" x1="22" y1="18" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8fff6"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#ringGradient)" stroke-width="4"/>

  <path d="M20 32h6" fill="none" stroke="url(#pulseGradient)" stroke-width="4" stroke-linecap="round"/>
  <path d="M38 32h6" fill="none" stroke="url(#pulseGradient)" stroke-width="4" stroke-linecap="round"/>

  <rect x="27" y="22" width="3.2" height="20" rx="1.6" fill="url(#pulseGradient)"/>
  <rect x="30.4" y="18" width="3.2" height="28" rx="1.6" fill="url(#pulseGradient)"/>
  <rect x="33.8" y="25" width="3.2" height="14" rx="1.6" fill="url(#pulseGradient)"/>
</svg>
